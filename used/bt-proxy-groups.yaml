proxy-groups:
    # BT 业务组定义 (2026-11-07 新增)
    #
    # 为什么需要这个组:
    #   qBittorrent 跑在 NAS 容器里,tracker announce 流量此前落进「兜底组」
    #   → 「其他-手选」→ BestCF.pages.dev 共享优选节点,出口 IP 在 Cloudflare 段
    #     (162.159.197.x / 104.28.158.x) 间跳变,且大量 i/o timeout。
    #   tracker 判滥用 + 入站 peer 与出站 announce 出口不一致 → 连通率下降。
    #
    # 设计要点:
    #   type: select —— 关键。用 select 而非 url-test/fallback,
    #     因为 URLTest 组每请求重新挑最快节点(fact #1032: 实测 Pornhub 474 就是
    #     规则命中正确、但上游挂在 URLTest 组上导致每请求换出口 IP、签名失配),
    #     BT 必须能手动钉死一个固定节点以保证出口 IP 稳定。
    #   上游顺序 —— 「手选」组排在最前,便于在面板上手动指定固定节点;
    #     「故转」组(fallback→智选 URLTest)仅作后置兜底,不建议选它。
    #
    # 落地方式:
    #   本文件是路由器 proxy-groups 段的来源。路由器 my-config.yaml 的
    #   proxy-groups 需要存在同名 BT 组,rules 段需要:
    #       - RULE-SET,bt,BT
    #   (原为 - RULE-SET,bt, DIRECT)
    #
    # 上游组名对应关系(路由器 my-config.yaml 现有 45 个组):
    #   日本-手选 / 美国-手选 / 新加坡-手选 / 香港-手选  —— select, 可手动钉节点
    #   日本-故转 / 美国-故转 / 新加坡-故转 / 香港-故转  —— fallback, 链尾是「智选」URLTest
    #   兜底组                                                  —— select, 链尾指向「其他-手选」
    #   DIRECT                                                  —— 直连
    #
    # 默认选 DIRECT(2026-11-07 实测结论):
    #   ① 机场节点全是多出口负载均衡落地机 —— 实测 24 个节点,出口 IP 全部在跳:
    #      JP_🇯🇵-01 → 141.147.162.33 / 64.110.104.30 / 43.175.18.181
    #      天诚优选1 → 167.179.75.237 / 168.138.46.67 / 160.16.209.61
    #      全部落在 AWS / Oracle / SoftLayer 公有云段(141.147 / 64.110 / 43.175 /
    #      8.221 / 167.179 / 168.138 / 160.16),一个入口后面挂多个出口,配置改不动。
    #   ② 共享优选节点存活期极短 —— 实测同一节点几分钟内从「tracker 全通」变成
    #      「全部 i/o timeout」:F1-小日本儿-01.T 通 → 02.T 通 → 全挂,轮番上演。
    #      入口 IP 43.161.221.119 / 172.64.229.36 / 45.202.255.174 依次超时。
    #   ③ tracker 直连可达 7/14,代理 8/14 —— 差异很小,且挂掉的那些是 tracker 本身死了
    #      (路由器本机直连测得同样结果,排除代理因素):
    #      tracker.dler.org / tracker.opentrackr.org / tracker.breizh.pm / tracker.dler.com 通
    #      open.demonii.com / tracker.torrent.eu.org / tracker.gmi.gd / tracker.nyaa.vc 等不通
    #   ④ BT 的 peer 发现主力是 DHT/PEX,不是 tracker —— 实测 qBittorrent 在
    #      tracker 大量超时的情况下,DHT 依然拿到 peer(leechs=1)。
    #      tracker 只是补充 peer 源,用家宽 IP 报 announce 信誉度远高于数据中心 IP。
    #
    # 如需改走代理,直接在 OpenClash 面板把 BT 组切到「美国-手选」等即可(Select 类型,
    # 手动切换即生效,无需改配置)。建议切「美国-手选」—— 实测 tracker 3/3 全通。

    - name: BT
      type: select
      proxies:
        - DIRECT
        - 日本-手选
        - 美国-手选
        - 新加坡-手选
        - 香港-手选
        - 日本-故转
        - 美国-故转
        - 新加坡-故转
        - 香港-故转
        - 兜底组
      fallback:
        - DIRECT
        - 日本-手选
        - 美国-手选
        - 新加坡-手选
        - 香港-手选
        - 日本-故转
        - 美国-故转
        - 新加坡-故转
        - 香港-故转
        - 兜底组
