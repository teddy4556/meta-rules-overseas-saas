proxy-groups:
    # BT 业务组定义 (2026-11-07 新增)
    #
    # 为什么需要这个组:
    #   qBittorrent 跑在 NAS 容器里,tracker announce 流量此前落进「兜底组」
    #   → 「其他-手选」→ BestCF.pages.dev 共享优选节点,出口 IP 在 Cloudflare 段
    #     (162.159.197.x / 104.28.158.x) 间跳变,且大量 i/o timeout。
    #   tracker 判滥用 + 入站 peer 与出站 announce 出口不一致 → 连通率下降。
    #
    # 设计要点:
    #   type: select —— 关键。用 select 而非 url-test/fallback,
    #     因为 URLTest 组每请求重新挑最快节点(fact #1032: 实测 Pornhub 474 就是
    #     规则命中正确、但上游挂在 URLTest 组上导致每请求换出口 IP、签名失配),
    #     BT 必须能手动钉死一个固定节点以保证出口 IP 稳定。
    #   上游顺序 —— 「手选」组排在最前,便于在面板上手动指定固定节点;
    #     「故转」组(fallback→智选 URLTest)仅作后置兜底,不建议选它。
    #
    # 落地方式:
    #   本文件是路由器 proxy-groups 段的来源。路由器 my-config.yaml 的
    #   proxy-groups 需要存在同名 BT 组,rules 段需要:
    #       - RULE-SET,bt,BT
    #   (原为 - RULE-SET,bt, DIRECT)
    #
    # 上游组名对应关系(路由器 my-config.yaml 现有 45 个组):
    #   日本-手选 / 美国-手选 / 新加坡-手选 / 香港-手选  —— select, 可手动钉节点
    #   日本-故转 / 美国-故转 / 新加坡-故转 / 香港-故转  —— fallback, 链尾是「智选」URLTest
    #   兜底组                                                  —— select, 链尾指向「其他-手选」
    #   DIRECT                                                  —— 直连
    #
    # ★ 2026-11-08 修订:BT 首选从 DIRECT 改为「美国-故转」
    #
    # 起因:BT 规则集污染 → pornhub 串味(见 used/bt.yaml 同日提交)
    #   2026-11-07 22:41 路由器拉取的 used/bt.yaml 里混进了
    #   - DOMAIN-SUFFIX,pornhub.com → www.pornhub.com 命中 RULE-SET,bt
    #   (index 31)而不是 RULE-SET,pornhub (index 42)→ 流量进 BT 组。
    #   BT 组当时 now=DIRECT → 直连被掐断 TLS,VidBee 5 条 PornHub 任务全灭
    #   (curl: (35) BoringSSL SSL_connect: Connection closed abruptly)。
    #
    # 为什么首选不能是 DIRECT(2026-11-08 全量复测 14 个 tracker,各 2~3 轮):
    #   DIRECT     3~4/14 通  (opentrackr / dler.com / nyaa.vc / breizh.pm 轮替)
    #   美国-故转   8~9/14 通  (上列 + open.demonii / tracker.gmi.gd / d.rutor.info / nyaa.si)
    #   → 代理路径稳定好一倍。2026-11-07 注释里「直连 7/14」的结论已随节点池换代过时。
    #
    # 为什么不用「智选 / 故转」链尾(URLTest):每请求换出口 IP,
    #   BT 需要固定出口做 announce 信誉(见上方设计要点)。
    #
    # 「美国-故转」是 fallback,链尾同样是「美国-智选」URLTest —— 但当前实测
    #   美国-智选 tracker 3/3 稳定、且比日本链(日本-智选 → F1-小日本儿 共享优选,
    #   存活期仅几分钟)可靠得多。若日后需绝对固定出口,可在面板把 BT 组
    #   手动切到「美国-手选」并钉死单个节点(那个组是 select,不会自动轮换)。
    #
    # DIRECT 保留在列表中:BT 种子站/部分 tracker 仍适合直连(家宽 IP announce 信誉更高),
    #   需要时在面板手动切回即可。
    #
    # ★ 另注:PornHub 业务已与 BT 完全分开 —— 走自己的「Pornhub」组,不经过本组。
    #   2026-11-08 实测日志已确认 NAS 流量命中 match RuleSet/pornhub。

    - name: BT
      type: select
      proxies:
        - 美国-故转
        - DIRECT
        - 日本-手选
        - 美国-手选
        - 新加坡-手选
        - 香港-手选
        - 日本-故转
        - 新加坡-故转
        - 香港-故转
        - 兜底组
      fallback:
        - 美国-故转
        - DIRECT
        - 日本-手选
        - 美国-手选
        - 新加坡-手选
        - 香港-手选
        - 日本-故转
        - 新加坡-故转
        - 香港-故转
        - 兜底组
