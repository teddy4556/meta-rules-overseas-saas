    # BT 业务规则集 (2026-11-07 重写)
    #
    # 背景: 原 bt.yaml 用 PROCESS-NAME,qBittorrent,DIRECT 匹配进程名,
    # 但 OpenClash 的 PROCESS-NAME 依赖 nftables/iptables 进程名匹配,
    # NAS 上 qBittorrent 跑在容器里 (实际进程名 qbittorrent-nox),
    # 流量经 docker NAT 后到路由器时已丢失原始进程上下文 → 规则零命中。
    # 实测 (2026-11-07): mihomo /tmp/openclash.log 全量日志搜 'match RuleSet/bt' 零命中;
    #              tracker2.dler.org / open.demonii.com / tracker.gmi.gd 等
    #              实际走 'dial 兜底组 (match Match/)' → 其他-手选 → BestCF 优选节点,
    #              出口 IP 在 Cloudflare 段 (162.159.197.x) 间跳变,且大量 i/o timeout。
    #
    # 本次改为域名匹配(不依赖进程嗅探,容器/非容器场景都生效):
    #   tracker 域名 104 条 (公开 tracker 列表实测从本 NAS 可解析)
    #   BT 种子站域名 69 条 (Jackett indexer 站点)
    #   tracker 裸 IP 5 条 (走 IP-CIDR)
    #
    # 策略: 由路由器 rules 段 RULE-SET,bt,<策略> 指定,规则集不带策略后缀
    #       (与本仓库其余 42 个 rule-set 保持一致)
    # 配套: 路由器 proxy-groups 需存在名为 BT 的 select 组
    #       (type: select, 上游挂各地区「手选」组,可用手动钉死固定节点)
