name: build-mrs

on:
  push:
    branches: [main]
    paths:
      - '*.yaml'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mihomo binary (latest release)
        run: |
          # 用 GitHub API 取最新 release tag,避免硬编码版本
          TAG=$(curl -s https://api.github.com/repos/metacubex/mihomo/releases/latest | grep '"tag_name"' | sed -E 's/.*"tag_name":[[:space:]]*"([^"]+)".*/\1/')
          echo "Using mihomo tag: $TAG"
          URL="https://github.com/metacubex/mihomo/releases/download/${TAG}/mihomo-linux-amd64-compatible-${TAG}.gz"
          echo "Downloading: $URL"
          curl -sL "$URL" -o mihomo.gz
          ls -la mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo version

      - name: Compile all .mrs (per business group)
        run: |
          for yaml in *.yaml; do
            mrs="${yaml%.yaml}.mrs"
            ./mihomo convert-ruleset domain text "$yaml" "$mrs"
          done

      - name: Verify .mrs artifacts
        run: |
          echo "Total .mrs: $(ls *.mrs | wc -l)"
          ls -la *.mrs | head -5

      - name: Commit .mrs artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.mrs
          git diff --staged --quiet || git commit -m "build: auto-compile $(ls *.mrs | wc -l) business-group .mrs files"
          git push