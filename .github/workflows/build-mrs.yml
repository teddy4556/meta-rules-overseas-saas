name: build-mrs

on:
  push:
    branches: [main]
    paths:
      - '*.yaml'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 增加到 25 分钟(mihomo source build 首次可能 5-15 分钟)
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true   # 自动 cache Go module

      - name: Build mihomo binary from source
        run: |
          set -e
          echo "::group::Clone mihomo source"
          if [ ! -d "mihomo-src" ]; then
            git clone --depth 1 --branch v1.19.30 https://github.com/MetaCubeX/mihomo.git mihomo-src
          fi
          echo "::endgroup::"

          echo "::group::Build"
          cd mihomo-src
          # verbose: -v 显示编译过程
          go build -v -o ../bin/mihomo . 2>&1 | tail -20
          cd ..
          echo "::endgroup::"

          chmod +x bin/mihomo
          bin/mihomo version

      - name: Compile all .mrs (per business group)
        run: |
          for yaml in *.yaml; do
            mrs="${yaml%.yaml}.mrs"
            bin/mihomo convert-ruleset domain text "$yaml" "$mrs"
          done

      - name: Verify .mrs artifacts
        run: |
          echo "Total .mrs: $(ls *.mrs | wc -l)"
          ls -la *.mrs | head -5

      - name: Commit .mrs artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.mrs
          git diff --staged --quiet || git commit -m "build: auto-compile $(ls *.mrs | wc -l) business-group .mrs files"
          git push