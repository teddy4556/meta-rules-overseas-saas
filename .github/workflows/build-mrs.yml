name: build-mrs

on:
  push:
    branches: [main]
    paths:
      - '*.yaml'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install mihomo
        run: |
          # mihomo v1.19+: module = github.com/metacubex/mihomo (no /cmd/mihomo suffix)
          go install github.com/metacubex/mihomo@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          mihomo version | head -2

      - name: Compile all .mrs (per business group)
        run: |
          for yaml in *.yaml; do
            mrs="${yaml%.yaml}.mrs"
            mihomo convert-ruleset domain text "$yaml" "$mrs"
          done

      - name: Verify .mrs artifacts
        run: |
          echo "Total .mrs: $(ls *.mrs | wc -l)"
          ls -la *.mrs | head -5

      - name: Commit .mrs artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.mrs
          git diff --staged --quiet || git commit -m "build: auto-compile $(ls *.mrs | wc -l) business-group .mrs files"
          git push