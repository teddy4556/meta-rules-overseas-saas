name: build-mrs

on:
  push:
    branches: [main]
    paths:
      - '*.yaml'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build mihomo from source (cloned repo has its own go.mod as main module)
        run: |
          # 关键: mihomo v1.19+ go.mod 含 replace 指令,不能跨包 go install
          # 正确做法: 整 repo clone 下来,以 root module 身份 build
          git clone --depth 1 --branch v1.19.30 https://github.com/MetaCubeX/mihomo.git
          cd mihomo
          go build -o ../mihomo .
          cd ..
          ./mihomo version

      - name: Compile all .mrs (per business group)
        run: |
          for yaml in *.yaml; do
            mrs="${yaml%.yaml}.mrs"
            ./mihomo convert-ruleset domain text "$yaml" "$mrs"
          done

      - name: Verify .mrs artifacts
        run: |
          echo "Total .mrs: $(ls *.mrs | wc -l)"
          ls -la *.mrs | head -5

      - name: Commit .mrs artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.mrs
          git diff --staged --quiet || git commit -m "build: auto-compile $(ls *.mrs | wc -l) business-group .mrs files"
          git push