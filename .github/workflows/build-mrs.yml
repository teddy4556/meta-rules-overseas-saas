name: build-mrs

on:
  push:
    branches: [main]
    paths:
      - '*.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install mihomo
        run: |
          GOBIN=$HOME/go/bin go install github.com/metacubex/mihomo/cmd/mihomo@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Compile .mrs (per-category)
        run: |
          for yaml in ai-tools.yaml collaboration.yaml developer-platforms.yaml design.yaml monitoring.yaml database.yaml auth.yaml misc.yaml; do
            mrs="${yaml%.yaml}.mrs"
            mihomo convert-ruleset domain text "$yaml" "$mrs"
          done

      - name: Commit .mrs artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.mrs
          git diff --staged --quiet || git commit -m "build: auto-compile 8 category .mrs files"
          git push