name: build-mrs

on:
  push:
    branches: [main]
    paths:
      - '*.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mihomo release binary
        run: |
          # Download mihomo linux amd64 compatible build (has convert-ruleset subcommand)
          curl -sL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-compatible-v1.19.30.gz -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo version | head -3

      - name: Compile all .mrs (per business group)
        run: |
          for yaml in *.yaml; do
            mrs="${yaml%.yaml}.mrs"
            ./mihomo convert-ruleset domain text "$yaml" "$mrs"
          done

      - name: Verify .mrs artifacts
        run: |
          ls -la *.mrs | head -10
          echo "---"
          echo "Total .mrs files: $(ls *.mrs | wc -l)"

      - name: Commit .mrs artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.mrs
          git diff --staged --quiet || git commit -m "build: auto-compile 30 business-group .mrs files"
          git push